<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Aerial</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --label: #000; --secondary: rgba(60,60,67,.6);
    --sep: rgba(60,60,67,.18); --segment: #fff; --tint: #007aff; --fill: rgba(118,118,128,.12); --danger: #ff3b30;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgba(235,235,245,.6);
      --sep: rgba(84,84,88,.6); --segment: #636366; --tint: #0a84ff; --fill: rgba(118,118,128,.24); --danger: #ff453a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans", system-ui, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom));
    max-width: 720px; margin-inline: auto;
  }
  header { padding: 28px 4px 8px; position: relative; }
  header h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  header p { margin: 4px 0 0; color: var(--secondary); font-size: 15px; }
  .lang { position: absolute; top: 24px; right: 4px; max-width: 46%; appearance: auto; border: 0; border-radius: 999px; background: var(--fill); color: var(--tint); font: inherit; font-size: 14px; font-weight: 600; padding: 7px 10px; cursor: pointer; }
  h2 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; color: var(--secondary); margin: 28px 4px 8px; }
  .group { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .segmented { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; }
  .segmented.two { grid-template-columns: repeat(2, 1fr); }
  .segmented button {
    appearance: none; border: 0; background: transparent; color: var(--label); font: inherit; font-size: 15px; font-weight: 500;
    padding: 9px 0; border-radius: 8px; transition: background .2s ease, box-shadow .2s ease;
  }
  .segmented button[aria-pressed="true"] { background: var(--segment); box-shadow: 0 1px 4px rgba(0,0,0,.12); font-weight: 600; }
  .segmented button:active { transform: scale(.97); }
  .hint { color: var(--secondary); font-size: 13px; margin: 8px 4px 0; }
  .upload {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 15px; border: 0; border-radius: 14px; background: var(--tint); color: #fff;
    font: inherit; font-weight: 600; transition: transform .16s ease-out, opacity .2s ease;
  }
  .upload:active { transform: scale(.98); }
  .upload[disabled] { opacity: .6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .wp { position: relative; border: 0; padding: 0; background: none; color: inherit; font: inherit; text-align: left; }
  .wp img, .wp .ph {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--fill);
    transition: transform .2s ease-out, box-shadow .2s ease;
  }
  .wp:active img { transform: scale(.97); }
  .wp .t { font-size: 14px; font-weight: 500; margin: 6px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wp .c { font-size: 12px; color: var(--secondary); margin: 1px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wp[aria-selected="true"] img { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--tint); }
  .check {
    position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--tint); color: #fff; display: none; align-items: center; justify-content: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .wp[aria-selected="true"] .check { display: flex; }
  .del {
    position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.55); color: #fff; font-size: 15px; line-height: 26px; padding: 0;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .ren { left: auto; right: 8px; }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: rgba(30,30,30,.92); color: #fff; padding: 10px 18px; border-radius: 22px; font-size: 15px;
    opacity: 0; transition: opacity .2s ease, transform .3s cubic-bezier(.23,1,.32,1); pointer-events: none;
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .empty { color: var(--secondary); font-size: 15px; padding: 4px; }
  .wx { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px; }
  .wx b { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
  .wx span { color: var(--secondary); font-size: 15px; }
  .city { display: flex; gap: 8px; margin-top: 10px; }
  .city input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--label); background: var(--card);
    border: 0; border-radius: 10px; padding: 11px 12px; box-shadow: var(--shadow); outline: none;
  }
  .city input:focus { box-shadow: 0 0 0 2px var(--tint); }
  .city button {
    font: inherit; font-weight: 600; font-size: 15px; border: 0; border-radius: 10px; padding: 0 16px;
    background: var(--tint); color: #fff; transition: transform .16s ease-out, opacity .2s ease;
  }
  .city button:active { transform: scale(.97); }
  .city button[disabled] { opacity: .6; }
  .diag {
    display: block; width: 100%; height: 220px; margin-top: 10px; font: 12px/1.4 ui-monospace, Menlo, monospace;
    color: var(--label); background: var(--card); border: 0; border-radius: 12px; padding: 10px; box-shadow: var(--shadow);
  }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  /* A display rule would otherwise show what is hidden (the diagnostics box and its buttons). */
  [hidden] { display: none !important; }
  .row .upload { flex: 1; padding: 13px; }
  .row .upload.plain { background: var(--fill); color: var(--tint); text-decoration: none; }
  .link { appearance: none; border: 0; background: none; color: var(--tint); font: inherit; font-size: 13px; padding: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  * { scrollbar-color: var(--secondary) var(--bg); scrollbar-width: auto; }
  *::-webkit-scrollbar { width: 12px; height: 12px; }
  *::-webkit-scrollbar-track { background: var(--bg); }
  *::-webkit-scrollbar-thumb { background: var(--secondary); border: 3px solid var(--bg); border-radius: 8px; }
  html { scrollbar-gutter: stable; }
  button, a.upload, label.upload { cursor: pointer; }
  button:disabled { cursor: default; opacity: .55; }
  :focus-visible { outline: 3px solid var(--tint); outline-offset: 3px; }
  button:hover:not(:disabled) { filter: brightness(.95); }
  textarea, .resize-none { resize: none; }
  .theme-form { padding: 18px; }
  .theme-form label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; min-height: 48px; }
  .theme-form label span { overflow-wrap: anywhere; }
  .theme-form input[type=text] { min-width: 0; width: 55%; background: var(--fill); color: var(--label); border: 1px solid var(--sep); padding: 11px; border-radius: 10px; font: inherit; }
  .theme-colors { display: grid; grid-template-columns: 1fr 1fr; column-gap: 24px; }
  .theme-form input[type=color] { width: 48px; height: 38px; border: 0; padding: 2px; background: var(--fill); border-radius: 8px; cursor: pointer; }
  .theme-form select {max-width:55%;min-width:0;background:var(--fill);color:var(--label);font:inherit;padding:10px;border:1px solid var(--sep);border-radius:10px;}
  .theme-form input[type=range] { width: 112px; accent-color: var(--tint); }
  .theme-form input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--tint); }
  .theme-preview { padding: 20px; margin: 12px 0; border-radius: 16px; min-height: 162px; overflow: hidden; }
  .theme-preview strong { display: block; font-size: 40px; line-height: 1.1; letter-spacing: -.03em; }
  .theme-preview p { font-size: 14px; }
  .theme-preview .sample { display: inline-block; border-radius: 10px; padding: 8px 18px; }
  .theme-status { min-height: 64px; padding: 10px 4px; margin: 0; font-size: 14px; color: var(--secondary); overflow-wrap: anywhere; }
  .theme-status.error { color: var(--danger); }
  #themePresets { grid-template-columns: repeat(auto-fit, minmax(85px, 1fr)); }
  .theme-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .theme-actions button, .theme-actions a { flex: 1 1 180px; }
  #themeFile { max-width: 100%; margin-top: 12px; min-height: 40px; font: inherit; }
  dialog { color: var(--label); background: var(--card); border: 1px solid var(--sep); border-radius: 22px; padding: 24px; width: min(92vw, 430px); }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog p { margin-top: 0; overflow-wrap: anywhere; }
  dialog input { width: 100%; padding: 10px; font: inherit; color: var(--label); background: var(--bg); border: 1px solid var(--sep); border-radius: 10px; }
  @media (max-width: 390px) { .theme-colors { grid-template-columns: 1fr; } .theme-form { padding: 14px; } }
  @media (forced-colors: active) { :focus-visible { outline-color: Highlight; } input, button { border: 1px solid ButtonText; } }
</style>
</head>
<body>
<header>
  <h1>Aerial</h1>
  <p>{{DEVICE}} · <span data-i18n="personalize"></span></p>
  <select class="lang" id="lang" data-i18n-aria-label="language"></select>
</header>

<section id="themes" aria-labelledby="themeHeading">
<h2 id="themeHeading" data-i18n="theme_title"></h2>
<div class="segmented" id="themePresets" role="group" data-i18n-aria-label="theme_title"></div>
<p class="hint" data-i18n="theme_hint"></p>
<p id="themeStatus" class="theme-status" role="status" aria-live="polite" data-i18n="theme_wait"></p>
<form id="themeForm" class="group theme-form" novalidate>
<label for="themeName"><span data-i18n="theme_name"></span><input id="themeName" type="text" maxlength="32" required aria-describedby="themeStatus"></label>
<div class="theme-preview" id="themePreview" aria-hidden="true"><strong id="themePreviewClock">20:24</strong><p id="themePreviewText" data-i18n="theme_preview_body"></p><span class="sample" id="themePreviewFocus" data-i18n="theme_preview"></span></div>
<div class="theme-colors"><label><span data-i18n="theme_focus"></span><input id="theme-focus" data-color="focus" type="color" aria-describedby="themeStatus"></label><label><span data-i18n="theme_on_focus"></span><input id="theme-on_focus" data-color="on_focus" type="color" aria-describedby="themeStatus"></label><label><span data-i18n="theme_text"></span><input id="theme-text" data-color="text" type="color" aria-describedby="themeStatus"></label><label><span data-i18n="theme_secondary"></span><input id="theme-secondary" data-color="secondary" type="color" aria-describedby="themeStatus"></label><label><span data-i18n="theme_glass"></span><input id="theme-glass" data-color="glass" type="color" aria-describedby="themeStatus"></label><label><span data-i18n="theme_app_focus"></span><input id="theme-app_focus" data-color="app_focus" type="color" aria-describedby="themeStatus"></label><label><span data-i18n="theme_clock"></span><input id="theme-clock" data-color="clock" type="color" aria-describedby="themeStatus"></label></div>
<label><span data-i18n="theme_clock_scale"></span><span><input id="themeClockScale" type="range" min="85" max="100" value="100" aria-describedby="themeStatus"><output id="themeClockValue">100%</output></span></label>
<label><span data-i18n="theme_roundness"></span><span><input id="themeRoundness" type="range" min="75" max="115" value="100" aria-describedby="themeStatus"><output id="themeRoundValue">100%</output></span></label>
<h2 data-i18n="theme_layout"></h2><div class="theme-colors"><label><span data-i18n="theme_one_row"></span><input type="checkbox" data-layout="one_row_home"></label><label><span data-i18n="theme_peek"></span><input type="checkbox" data-layout="peek_next_row"></label><label><span data-i18n="theme_plate"></span><input type="checkbox" data-layout="home_plate"></label><label><span data-i18n="theme_names"></span><input type="checkbox" data-layout="show_all_names"></label><label><span data-i18n="theme_right"></span><input type="checkbox" data-layout="clock_right"></label><label><span data-i18n="theme_large"></span><input type="checkbox" data-layout="large_clock"></label></div>
<button id="themeSave" class="upload" type="submit" data-i18n="theme_apply"></button>
</form>
<div class="theme-actions"><button type="button" class="upload plain" id="themeUndo" data-i18n="theme_undo" disabled></button><a class="upload plain" id="themeExport" download="Aerial-theme.json" data-i18n="theme_export"></a><button type="button" class="upload plain" id="themeReload" onclick="loadCurrentTheme()" data-i18n="theme_reload"></button></div>
<label for="themeFile" class="hint" data-i18n="theme_choose_file"></label><input id="themeFile" type="file" accept=".json,application/json">
</section>

<section id="remoteKeys" aria-labelledby="shortcutHeading">
<h2 id="shortcutHeading" data-i18n="shortcut_title"></h2>
<p class="hint" data-i18n="shortcut_hint"></p>
<form id="shortcutForm" class="group theme-form">
<label for="shortcutApp"><span data-i18n="shortcut_shopping"></span><select id="shortcutApp" aria-describedby="shortcutStatus"></select></label>
<button type="submit" id="shortcutSave" class="upload" data-i18n="shortcut_save"></button>
</form>
<p id="shortcutStatus" class="theme-status" role="status" aria-live="polite"></p>
<button type="button" id="shortcutReload" class="upload plain" data-i18n="shortcut_reload"></button>
</section>

<h2 data-i18n="screensaver"></h2>
<div class="segmented" id="ss" role="group" data-i18n-aria-label="screensaver_short">
  <button onclick="chooseScreensaver(this.dataset.mode)" data-mode="aerial" data-i18n="ss_aerial"></button>
  <button onclick="chooseScreensaver(this.dataset.mode)" data-mode="photos" data-i18n="ss_photos"></button>
  <button onclick="chooseScreensaver(this.dataset.mode)" data-mode="clock" data-i18n="ss_clock"></button>
</div>
<p class="hint" id="ssHint"></p>

<h2 data-i18n="focus"></h2>
<div class="segmented two" id="focus" role="group" data-i18n-aria-label="focus">
  <button onclick="chooseFocus(this.dataset.style)" data-style="high_contrast" data-i18n="focus_high"></button>
  <button onclick="chooseFocus(this.dataset.style)" data-style="standard" data-i18n="focus_standard"></button>
</div>
<p class="hint" id="focusHint"></p>

<h2 data-i18n="weather"></h2>
<div class="group wx"><b id="wxNow">—</b><span id="wxPlace"></span></div>
<form class="city" id="cityForm" novalidate>
  <input id="city" type="text" data-i18n-placeholder="city_ph" enterkeyhint="done" autocomplete="off">
  <button id="cityBtn" data-i18n="set"></button>
</form>
<p class="hint" id="wxHint"></p>

<h2 data-i18n="add_h"></h2>
<label class="upload" id="uploadBtn">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
  <span id="uploadLabel" data-i18n="upload_label"></span>
  <input id="file" type="file" accept="image/*" multiple hidden>
</label>

<div id="sections"></div>

<h2 data-i18n="icons_h"></h2>
<p class="hint" style="margin-top:0;margin-bottom:12px" data-i18n="icons_hint"></p>
<div class="grid" id="apps"></div>
<input id="iconFile" type="file" accept="image/*" hidden>

<h2 data-i18n="feedback_h"></h2>
<p class="hint" style="margin-top:0;margin-bottom:12px" data-i18n="feedback_hint"></p>
<button class="upload" id="diagBtn" onclick="collectDiagnostics()" data-i18n="diag_show"></button>
<textarea class="diag resize-none" id="diag" readonly hidden></textarea>
<div class="row" id="diagActions" hidden>
  <button class="upload" id="diagCopy" onclick="copyDiagnostics()" data-i18n="diag_copy"></button>
  <a class="upload plain" href="https://github.com/pengchujin/aerial-tv/issues/new?template=device.yml" target="_blank" rel="noopener" data-i18n="diag_github"></a>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="actionDialog" aria-labelledby="actionMessage"><form id="actionForm" method="dialog" novalidate><p id="actionMessage"></p><input id="actionInput" aria-labelledby="actionMessage" hidden><div class="row"><button class="upload plain" value="cancel" id="actionCancel" data-i18n="action_cancel"></button><button class="upload" value="ok" data-i18n="action_confirm"></button></div></form></dialog>

const LANGS = Object.keys(TEXTS);
const LANG = (() => {
  const asked = new URLSearchParams(location.search).get('lang');
  let saved = null;
  try { saved = localStorage.getItem('aerial-lang'); } catch (e) {}
  const prefs = [asked, saved, ...(navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''])];
  for (const l of prefs) { if (!l) continue; const c = String(l).toLowerCase().split('-')[0]; if (LANGS.includes(c)) return c; }
  return 'en';
})();
const NAMES = { zh: '中文', en: 'English', ru: 'Русский', uk: 'Українська', kk: 'Қазақша' };
const I18N = {};
for (const l of LANGS) { I18N[l] = {}; KEYS.forEach((k, i) => I18N[l][k] = TEXTS[l][i]); }
function t(key, vars) {
  let s = I18N[LANG][key] || I18N.en[key] || I18N.zh[key] || key;
  if (vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
function initLangSwitch() {
  const s = $('#lang');
  for (const l of LANGS) { const o = document.createElement('option'); o.value = l; o.textContent = NAMES[l] || l; s.appendChild(o); }
  s.value = LANG;
  s.onchange = async () => {
    if (themeDirty && !await confirmAction(t('theme_discard'))) { s.value=LANG; return; }
    if (shortcutDirty && !await confirmAction(t('shortcut_discard'))) { s.value=LANG; return; }
    themeDirty=false; shortcutDirty=false;
    try { localStorage.setItem('aerial-lang', s.value); } catch (e) {}
    const u = new URL(location.href); u.searchParams.set('lang', s.value); location.replace(u.toString());
  };
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria-label]').forEach(e => e.setAttribute('aria-label', t(e.dataset.i18nAriaLabel)));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(e => e.setAttribute('placeholder', t(e.dataset.i18nPlaceholder)));
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove('on'), 1800);
}

async function api(path, body) {
  const opts = body ? { method: 'POST', body: new URLSearchParams(body) } : {};
  const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), 12000);
  let r; try { r = await fetch(base + path, {...opts,signal:controller.signal}); } finally { clearTimeout(timer); }
  if (!r.ok) throw new Error(r.status);
  const incoming = await r.json();
  if (state?.theme && incoming.theme?.revision < state.theme.revision) incoming.theme = state.theme;
  if (state?.shortcuts && incoming.shortcuts?.revision < state.shortcuts.revision) incoming.shortcuts = state.shortcuts;
  return incoming;
}

function card(w, selected, extraClass) {
  const b = document.createElement('button');
  b.className = 'wp ' + (extraClass || '');
  b.setAttribute('aria-selected', selected ? 'true' : 'false');
  b.innerHTML = `<img loading="lazy" alt="" src="${base}thumb/${encodeURIComponent(w.id)}">
    <span class="check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <div class="t"></div><div class="c"></div>`;
  b.querySelector('.t').textContent = w.title;
  b.querySelector('.c').textContent = w.caption || '';
  b.onclick = async () => {
    state = await api('api/wallpaper', { id: w.id }); render(); toast(t('toast_wallpaper'));
  };
  if (w.kind === 'photo') {
    const d = document.createElement('button');
    d.className = 'del'; d.textContent = '✕'; d.setAttribute('aria-label', t('aria_delete'));
    d.onclick = async e => {
      e.stopPropagation();
      if (!await confirmAction(t('confirm_delete'))) return;
      state = await api('api/delete', { id: w.id }); render();
    };
    b.appendChild(d);
  }
  return b;
}

const weatherNames = { clear: t('wx_clear'), partlycloudy: t('wx_partlycloudy'), cloudy: t('wx_cloudy'), fog: t('wx_fog'), rain: t('wx_rain'), snow: t('wx_snow'), thunder: t('wx_thunder') };

function renderWeather() {
  const w = state.weather || {};
  $('#wxNow').textContent = w.celsius !== undefined ? `${w.celsius}° ${weatherNames[w.kind] || ''}` : '—';
  $('#wxPlace').textContent = w.place || '';
  const hint = $('#wxHint'); hint.innerHTML = '';
  if (w.chosen) {
    hint.append(t('wx_chosen', { place: w.place }));
    const b = document.createElement('button'); b.className = 'link'; b.textContent = t('wx_auto_btn');
    b.onclick = async () => { state = await api('api/weather/auto', {}); render(); toast(t('toast_auto')); };
    hint.append(b);
  } else {
    hint.textContent = w.place
      ? t('wx_guessed', { place: w.place })
      : t('wx_none');
  }
}

let iconFor = null;
function renderApps() {
  const g = $('#apps'); g.innerHTML = '';
  for (const a of state.apps || []) {
    const b = document.createElement('button');
    b.className = 'wp';
    b.innerHTML = `<img loading="lazy" alt=""><div class="t"></div><div class="c"></div>`;
    b.querySelector('img').src = `${base}tile/${encodeURIComponent(a.key)}?v=${a.stamp}-${a.look || 0}`;
    b.querySelector('.t').textContent = a.label;
    b.querySelector('.c').textContent = a.source ? (a.label === a.port ? t('tag_source') : a.port) : a.custom ? t('tag_custom') : '';
    if (a.source) {
      const n = document.createElement('button');
      n.className = 'del ren'; n.textContent = '✎'; n.setAttribute('aria-label', t('aria_rename'));
      n.onclick = async e => {
        e.stopPropagation();
        const name = await promptAction(t('prompt_rename', { port: a.port }), a.name || '');
        if (name === null) return;
        try { state = await api('api/source/name', { app: a.key, name }); render(); toast(t(name.trim() ? 'toast_renamed' : 'toast_name_reset')); }
        catch (err) { toast(t('toast_rename_fail')); }
      };
      b.appendChild(n);
    }
    b.onclick = () => { iconFor = a; $('#iconFile').click(); };
    if (a.custom) {
      const r = document.createElement('button');
      r.className = 'del'; r.textContent = '↺'; r.setAttribute('aria-label', t('aria_reset_icon'));
      r.onclick = async e => {
        e.stopPropagation();
        if (!await confirmAction(t('confirm_reset_icon', { label: a.label }))) return;
        state = await api('api/icon/reset', { app: a.key }); render(); toast(t('toast_icon_reset'));
      };
      b.appendChild(r);
    }
    g.appendChild(b);
  }
}

function render() {
  renderTheme();
  renderShortcut();
  renderWeather();
  renderApps();
  document.querySelectorAll('#ss button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.mode === state.screensaver ? 'true' : 'false'));
  $('#ssHint').textContent = state.screensaverFollows
    ? t('hint_follows')
    : (hints[state.screensaver] || '');
  document.querySelectorAll('#focus button').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.style === state.focusStyle ? 'true' : 'false'));
  $('#focusHint').textContent = state.focusStyle === 'standard'
    ? t('focus_hint_standard')
    : t('focus_hint_high');
  const root = $('#sections'); root.innerHTML = '';
  for (const [kind, title, sub] of groups) {
    let list = state.wallpapers.filter(w => w.kind === kind);
    if (kind === 'daily' && list.length) {
      list = [{ id: state.latestDaily, kind: 'daily', title: t('daily_title'), caption: t('daily_caption') }, ...list];
    }
    // Two or more photos: one a day, as on the TV (#27, #194).
    if (kind === 'photo' && list.length > 1) {
      list = [{ id: state.rotatePhotos, kind: 'photos', title: t('rotate_title'), caption: t('rotate_caption') }, ...list];
    }
    if (!list.length && kind !== 'photo') continue;
    const h = document.createElement('h2'); h.textContent = title; root.appendChild(h);
    if (!list.length) {
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = t('empty_photos'); root.appendChild(p);
      continue;
    }
    const g = document.createElement('div'); g.className = 'grid';
    list.forEach(w => g.appendChild(card(w, w.id === state.selected)));
    root.appendChild(g);
    if (kind === 'photo' && list.length === 1) {
      const p = document.createElement('p'); p.className = 'empty'; p.textContent = t('add_second'); root.appendChild(p);
    }
  }
}

async function chooseScreensaver(mode) { try { state=await api('api/screensaver',{mode}); render(); } catch (_) { toast(t('toast_set_fail')); } }

$('#file').onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  const btn = $('#uploadBtn'); const label = $('#uploadLabel');
  btn.setAttribute('disabled', ''); label.textContent = t('sending_n', { n: files.length });
  try {
    const fd = new FormData(); files.forEach((f, i) => fd.append('photo' + i, f, f.name));
    const r = await fetch(base + 'api/upload', { method: 'POST', body: fd });
    state = await r.json(); render();
    toast(state.added ? t('toast_added', { n: state.added }) : t('toast_no_photos'));
  } catch (err) { toast(t('toast_send_fail')); }
  btn.removeAttribute('disabled'); label.textContent = t('upload_label'); e.target.value = '';
};

$('#cityForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('#city').value.trim(); if (!name) return;
  const btn = $('#cityBtn'); btn.setAttribute('disabled', '');
  try {
    state = await api('api/weather/city', { name }); render();
    toast(state.found ? t('toast_city_set', { place: state.weather.place }) : t('toast_city_nf', { name }));
    if (state.found) $('#city').value = '';
  } catch (err) { toast(t('toast_set_fail')); }
  btn.removeAttribute('disabled');
};

$('#iconFile').onchange = async e => {
  const f = e.target.files[0]; const a = iconFor; e.target.value = '';
  if (!f || !a) return;
  toast(t('toast_sending_icon', { label: a.label }));
  try {
    const fd = new FormData(); fd.append('app', a.key); fd.append('picture', f, f.name);
    const r = await fetch(base + 'api/icon', { method: 'POST', body: fd });
    if (!r.ok) throw new Error(r.status);
    state = await r.json(); render();
    toast(t(state.saved ? 'toast_icon_set' : 'toast_icon_bad'));
  } catch (err) { toast(t('toast_send_fail')); }
};

async function collectDiagnostics() {
  const b = $('#diagBtn'); b.disabled = true; b.textContent = t('diag_collecting');
  try {
    const r = await fetch(base + 'api/diagnostics');
    if (!r.ok) throw new Error(r.status);
    $('#diag').value = await r.text();
    $('#diag').hidden = false; $('#diagActions').hidden = false; b.hidden = true;
  } catch (e) { toast(t('toast_diag_fail')); b.textContent = t('diag_show'); }
  b.disabled = false;
};
// The page is plain HTTP on the LAN, where browsers offer no navigator.clipboard.
$('#diagCopy').onclick = () => {
  const t = $('#diag'); t.focus(); t.select(); t.setSelectionRange(0, t.value.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  toast(t(ok ? 'toast_copied' : 'toast_copy_manual'));
};

let shortcutDirty=false, shortcutBusy=false, shortcutRevision=0;
function shortcutPending(value) {
  shortcutBusy=value;
  $('#shortcutForm').querySelectorAll('select,button').forEach(e=>e.disabled=value);
  $('#shortcutReload').disabled=value;
}
function renderShortcut() {
  const data=state?.shortcuts;
  if(!data || shortcutDirty || shortcutBusy) return;
  const select=$('#shortcutApp'); select.replaceChildren();
  const add=(value,label)=>{const o=document.createElement('option');o.value=value;o.textContent=label;select.appendChild(o);};
  add('',t('shortcut_none'));
  for(const a of data.apps || []) add(a.key,a.label);
  if(data.app && !(data.apps || []).some(a=>a.key===data.app)) add(data.app,data.label);
  select.value=data.app || ''; shortcutRevision=data.revision;
  if(!data.ready) $('#shortcutStatus').textContent=t('shortcut_bridge');
}
$('#shortcutApp').onchange=()=>{shortcutDirty=true;$('#shortcutStatus').textContent='';};
$('#shortcutForm').onsubmit=async e=>{
  e.preventDefault();if(shortcutBusy)return;
  const selected=$('#shortcutApp').value;shortcutPending(true);
  try {
    state=await api('api/shortcut',{app:selected,revision:String(shortcutRevision)});
    shortcutDirty=false;shortcutPending(false);render();$('#shortcutStatus').classList.remove('error');$('#shortcutStatus').textContent=t('shortcut_saved');
  } catch(error) {
    $('#shortcutStatus').textContent=t(error.message==='409'?'shortcut_stale':'shortcut_failed');
    $('#shortcutStatus').classList.add('error');
  } finally {shortcutPending(false);}
};
$('#shortcutReload').onclick=async()=>{
  if(shortcutBusy || (shortcutDirty && !await confirmAction(t('shortcut_discard'))))return;
  shortcutPending(true);
  try {state=await api('api/state');shortcutDirty=false;shortcutPending(false);$('#shortcutStatus').textContent='';$('#shortcutStatus').classList.remove('error');render();}
  catch(error){$('#shortcutStatus').textContent=t('shortcut_failed');}
  finally {shortcutPending(false);}
};

initLangSwitch();
applyI18n();

function askAction(message, value) {
  return new Promise(resolve => {
    const dialog = $('#actionDialog'); const input = $('#actionInput'); const previous = document.activeElement;
    $('#actionMessage').textContent = message; input.hidden = value === undefined; input.value = value || '';
    dialog.returnValue = ''; dialog.onclose = () => { const result = dialog.returnValue === 'ok' ? (value === undefined ? true : input.value) : (value === undefined ? false : null); previous?.focus(); resolve(result); };
    dialog.showModal(); (value === undefined ? $('#actionCancel') : input).focus();
  });
}
$('#actionDialog form').addEventListener('keydown', e => { if (e.key==='Enter' && (e.isComposing || e.keyCode===229)) e.preventDefault(); });
const confirmAction = message => askAction(message);
const promptAction = (message, value) => askAction(message, value);
let themeDirty = false, themeBusy = false, themeDraft = null, themeRevision = null, themeLastRevision = null;
function themeMessage(key, error = false) { const e = $('#themeStatus'); e.textContent = key ? t(key) : ''; e.classList.toggle('error', error); }
function themeDefinition() {
  const d = JSON.parse(JSON.stringify(themeDraft)); d.name = $('#themeName').value;
  for (const input of document.querySelectorAll('[data-color]')) {
    const role = input.dataset.color; const old = d.colors[role]; const alpha = old?.length === 9 ? old.slice(1,3) : 'FF';
    d.colors[role] = '#' + alpha + input.value.slice(1);
  }
  d.metrics = { clock_scale: Number($('#themeClockScale').value) / 100, panel_roundness: Number($('#themeRoundness').value) / 100 };
  d.layout = {}; for (const input of document.querySelectorAll('[data-layout]')) d.layout[input.dataset.layout] = input.checked;
  return d;
}
function themePreview() {
  if (!themeDraft) return;
  const d = themeDefinition(); const rgb = key => '#' + d.colors[key].slice(-6);
  const p = $('#themePreview'); p.style.background = rgb('glass'); p.style.borderRadius = (16*d.metrics.panel_roundness)+'px';
  $('#themePreviewClock').style.color = rgb('clock'); $('#themePreviewClock').style.fontSize = (40*d.metrics.clock_scale)+'px';
  $('#themePreviewText').style.color = rgb('text'); const f = $('#themePreviewFocus'); f.style.background = rgb('focus'); f.style.color = rgb('on_focus');
  $('#themeClockValue').textContent = $('#themeClockScale').value + '%'; $('#themeRoundValue').textContent = $('#themeRoundness').value + '%';
}
function fillTheme(definition, layout, revision) {
  themeDraft = JSON.parse(JSON.stringify(definition)); themeDraft.colors ||= {}; themeDraft.metrics ||= {}; themeDraft.version ??= 1;
  const defaults = { focus:'#FFF5F5F7',on_focus:'#FF1D1D1F',text:'#FFFFFFFF',secondary:'#99EBEBF5',glass:'#E6202022',app_focus:'#FFFFFFFF',clock:'#FFFFFFFF' };
  themeDraft.colors = {...defaults,...themeDraft.colors}; themeRevision = revision;
  $('#themeName').value = themeDraft.name || '';
  for (const input of document.querySelectorAll('[data-color]')) { const value = themeDraft.colors[input.dataset.color]; input.value = /^#(?:[0-9a-f]{6}|[0-9a-f]{8})$/i.test(value) ? '#'+value.slice(-6) : '#ffffff'; }
  $('#themeClockScale').value = Math.round((themeDraft.metrics.clock_scale ?? 1)*100); $('#themeRoundness').value = Math.round((themeDraft.metrics.panel_roundness ?? 1)*100);
  for (const input of document.querySelectorAll('[data-layout]')) input.checked = (layout?.[input.dataset.layout] ?? themeDraft.layout?.[input.dataset.layout]) === true;
  themeDirty = false; themePreview();
}
function setThemeBusy(value) {
  themeBusy = value; $('#themeForm').setAttribute('aria-busy', String(value));
  document.querySelectorAll('#themes button, #themes input').forEach(e => e.disabled = value);
  $('#themeUndo').disabled = value || !state?.theme?.canUndo;
}
async function themeRequest(fields) {
  if (themeBusy) return;
  setThemeBusy(true); themeMessage('theme_saving');
  document.querySelectorAll('#themeForm [aria-invalid]').forEach(e => e.removeAttribute('aria-invalid'));
  let invalidFocus = null;
  try {
    const controller = new AbortController(); const timer = setTimeout(() => controller.abort(), 12000);
    let response; try { response = await fetch(base+'api/theme', {method:'POST',body:new URLSearchParams(fields),signal:controller.signal}); } finally { clearTimeout(timer); }
    const body = await response.json();
    if (!response.ok) {
      const code = ['theme_stale','theme_contrast','theme_invalid','theme_storage'].includes(body.error) ? body.error : 'theme_storage';
      themeMessage(code,true);
      const field = document.querySelector('[data-color="'+String(body.field).replace(/[^a-z_]/g,'')+'"]');
      const target = field || (body.field === 'name' ? $('#themeName') : null); if (target) { target.setAttribute('aria-invalid','true'); invalidFocus=target; }
      return;
    }
    state = body; themeDirty = false; themeLastRevision = null; setThemeBusy(false); render(); themeMessage('theme_saved');
  } catch (_) { themeMessage('theme_offline',true); }
  finally { setThemeBusy(false); invalidFocus?.focus(); }
}
function renderTheme() {
  const current = state?.theme; if (!current) return;
  if (!themeDraft) setThemeBusy(false);
  $('#themeUndo').disabled = themeBusy || !current.canUndo; $('#themeExport').href = base+'api/theme/export';
  if (themeLastRevision === current.revision) return;
  const root = $('#themePresets');
  // Keep the focused preset element while polling; a theme change updates its pressed state.
  if (!root.children.length || Array.from(root.children).map(b=>b.dataset.id).join() !== current.presets.map(p=>p.id).join()) {
    root.replaceChildren();
    for (const preset of current.presets) {
      const button = document.createElement('button'); button.type='button'; button.dataset.id=preset.id;
      button.textContent = preset.id === 'custom' ? preset.name : t('theme_'+(preset.id==='aerial'?'original':preset.id));
      button.onclick = async () => { if (themeDirty && !await confirmAction(t('theme_discard'))) return; await themeRequest({action:'select',id:preset.id,revision:String(state.theme.revision)}); };
      root.appendChild(button);
    }
  }
  for (const button of root.children) {
    button.setAttribute('aria-pressed', String(button.dataset.id===current.id));
    if (button.dataset.id==='custom') button.textContent=current.presets.find(p=>p.id==='custom')?.name || t('theme_custom');
  }
  if (!themeDirty && !themeBusy) { fillTheme(current.definition,current.layout,current.revision); themeMessage(null); }
  themeLastRevision = current.revision;
}
$('#themeForm').addEventListener('input', () => { themeDirty=true; themePreview(); });
$('#themeForm').addEventListener('keydown', e => { if (e.key==='Enter' && (e.isComposing || e.keyCode===229)) e.preventDefault(); });
$('#themeForm').onsubmit = async e => { e.preventDefault(); if (themeDraft) await themeRequest({action:'save',definition:JSON.stringify(themeDefinition()),revision:String(themeRevision)}); };
$('#themeUndo').onclick = async () => { if (themeDirty && !await confirmAction(t('theme_discard'))) return; await themeRequest({action:'undo',revision:String(state.theme.revision)}); };
async function loadCurrentTheme() {
  if (themeDirty && !await confirmAction(t('theme_discard'))) return;
  if (themeBusy && themeDraft) return;
  setThemeBusy(true);
  try { state=await api('api/state'); themeDirty=false; themeLastRevision=null; setThemeBusy(false); render(); }
  catch (_) { themeMessage('theme_offline',true); }
  finally { setThemeBusy(false); }
};
$('#themeFile').onchange = async e => {
  const file=e.target.files[0]; if (!file || themeBusy) return;
  if (themeDirty && !await confirmAction(t('theme_discard'))) { e.target.value=''; return; }
  setThemeBusy(true);
  try {
    if (file.size > 16384) throw new Error('size');
    const raw=await file.text();
    const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),12000);
    let response; try { response=await fetch(base+'api/theme',{method:'POST',body:new URLSearchParams({action:'validate',definition:raw,revision:String(state.theme.revision)}),signal:controller.signal}); } finally { clearTimeout(timer); }
    const body=await response.json();
    if (!response.ok) { themeMessage(body.error==='theme_contrast'?'theme_contrast':'theme_invalid',true); return; }
    fillTheme(body.definition,{...state.theme.layout,...body.definition.layout},state.theme.revision); themeDirty=true; themeMessage('theme_imported');
  } catch (err) { themeMessage(err.message==='size'?'theme_invalid':'theme_offline',true); }
  finally { e.target.value=''; setThemeBusy(false); }
};
window.addEventListener('beforeunload', e => { if (themeDirty || shortcutDirty) { e.preventDefault(); e.returnValue=''; } });

setThemeBusy(true); $('#themeReload').disabled=false;
let refreshPending=false;
async function refresh() { if(refreshPending)return; refreshPending=true; try { state=await api('api/state'); render(); } catch (_) { if(!state)themeMessage('theme_offline',true); } finally {refreshPending=false;} }
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 6000);
</script>
